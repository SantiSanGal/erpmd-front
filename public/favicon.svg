<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="laserGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="1" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded app icon -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Shadow below paper -->
  <rect x="120" y="100" width="272" height="340" rx="24" fill="#000000" opacity="0.25" />

  <!-- Invoice Paper -->
  <rect x="116" y="92" width="280" height="344" rx="24" fill="url(#paperGrad)" />

  <!-- Invoice Header lines -->
  <rect x="156" y="136" width="110" height="18" rx="9" fill="#4f46e5" />
  <rect x="310" y="136" width="50" height="18" rx="9" fill="#94a3b8" />

  <!-- Divider -->
  <rect x="156" y="174" width="204" height="4" rx="2" fill="#e2e8f0" />

  <!-- Invoice Body Lines -->
  <rect x="156" y="200" width="140" height="12" rx="6" fill="#cbd5e1" />
  <rect x="316" y="200" width="44" height="12" rx="6" fill="#94a3b8" />

  <rect x="156" y="228" width="120" height="12" rx="6" fill="#cbd5e1" />
  <rect x="316" y="228" width="44" height="12" rx="6" fill="#94a3b8" />

  <rect x="156" y="256" width="150" height="12" rx="6" fill="#cbd5e1" />
  <rect x="316" y="256" width="44" height="12" rx="6" fill="#94a3b8" />

  <!-- OCR Scanner Beam -->
  <rect x="96" y="284" width="320" height="10" rx="5" fill="url(#laserGrad)" filter="url(#glow)" />
  <line x1="96" y1="289" x2="416" y2="289" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />

  <!-- Invoice Footer / Total -->
  <rect x="156" y="336" width="80" height="14" rx="7" fill="#64748b" />
  <rect x="290" y="332" width="70" height="22" rx="8" fill="#10b981" />

  <rect x="156" y="380" width="204" height="24" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="6 4" />
  <circle cx="210" cy="392" r="4" fill="#94a3b8" />
  <circle cx="230" cy="392" r="4" fill="#94a3b8" />
  <circle cx="250" cy="392" r="4" fill="#94a3b8" />
  <circle cx="270" cy="392" r="4" fill="#94a3b8" />
  <circle cx="290" cy="392" r="4" fill="#94a3b8" />

  <!-- AI Sparkle Icon on corner -->
  <g transform="translate(360, 68)" filter="url(#glow)">
    <circle cx="36" cy="36" r="36" fill="#f59e0b" />
    <path d="M36 18 L39.5 29.5 L51 33 L39.5 36.5 L36 48 L32.5 36.5 L21 33 L32.5 29.5 Z" fill="#ffffff" />
  </g>
</svg>
